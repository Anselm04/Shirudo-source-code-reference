# HTTP/1.1 over TLS on 8443, with the certificate the image made.
Listen 8443
ServerName localhost

<VirtualHost *:8443>
	DocumentRoot /var/www/html
	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/demo.pem
	SSLCertificateKeyFile /etc/ssl/private/demo.key
</VirtualHost>
